<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in — DCR Copilot</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#122238; --paper:#F5F1E8; --ink:#16232E; --ink-dim:#4B5A68;
    --ochre:#C98A32; --line-dim:#9FB6CC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--blue-900); font-family:'IBM Plex Sans',sans-serif; padding:24px;
  }
  .card{
    background:var(--paper); color:var(--ink); max-width:480px; width:100%;
    border-radius:2px; padding:36px 32px; text-align:center;
  }
  h1{font-family:'Space Grotesk',sans-serif; font-size:26px; margin:0 0 8px;}
  p{color:var(--ink-dim); font-size:15px; line-height:1.6;}
  .key-box{
    font-family:'IBM Plex Mono',monospace; font-size:32px; letter-spacing:6px;
    background:var(--blue-900); color:#fff; padding:20px; border-radius:2px;
    margin:24px 0; word-break:break-all;
  }
  .steps{text-align:left; margin-top:28px; padding-top:20px; border-top:1px dashed #C9BFA4;}
  .steps li{margin-bottom:10px; font-size:14.5px; color:var(--ink-dim);}
  .btn{
    display:inline-block; background:var(--ochre); color:var(--blue-900);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    padding:13px 22px; border-radius:2px; text-decoration:none; margin-top:20px;
  }
  .loading, .error{padding:40px 0; color:var(--ink-dim);}
  .copy-note{font-size:12.5px; color:var(--ink-dim); margin-top:8px;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading" id="loading">Getting your activation key…</div>
</div>

<script>
  // CONFIG — set this to your deployed Worker URL
  const WORKER_BASE = "https://dcr-copilot-keys.designhaus.workers.dev";

  const params = new URLSearchParams(window.location.search);
  const paymentId = params.get("razorpay_payment_id") || params.get("payment_id");
  const card = document.getElementById("card");

  async function fetchKey(attempt = 0){
    if (!paymentId){
      card.innerHTML = '<div class="error">No payment ID found in the URL. If you just paid, check your email — the key was sent there too.</div>';
      return;
    }
    try {
      const res = await fetch(`${WORKER_BASE}/reveal?payment_id=${encodeURIComponent(paymentId)}`);
      if (res.status === 404 && attempt < 5){
        // webhook may take a few seconds to land — retry briefly
        setTimeout(() => fetchKey(attempt + 1), 2000);
        return;
      }
      if (!res.ok){
        showFallback();
        return;
      }
      const data = await res.json();
      showKey(data.key);
    } catch (e){
      showFallback();
    }
  }

  function showKey(key){
    card.innerHTML = `
      <h1>You're in.</h1>
      <p>Here's your activation key — also emailed to you, so it's safe either way.</p>
      <div class="key-box">${key}</div>
      <p class="copy-note">Save this somewhere you'll find it again.</p>
      <div class="steps">
        <ol>
          <li>Download the skill file (link below, and in your email).</li>
          <li>In Claude: Settings → Capabilities → enable Code execution → Skills → Add skill → upload the zip.</li>
          <li>Ask any UDCPR or DCPR-2034 question. The first time, Claude will ask for your key — paste the number above.</li>
        </ol>
      </div>
      <a class="btn" href="https://designhauscollective.in/downloads/dcr-copilot.zip">Download DCR Copilot →</a>
    `;
  }

  function showFallback(){
    card.innerHTML = '<div class="error">Payment received — but we couldn\'t load your key here. Check your email (it\'s sent automatically within a minute), or contact connect@designhauscollective.in with your payment ID.</div>';
  }

  fetchKey();
</script>
</body>
</html>
